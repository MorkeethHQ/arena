name: fixture smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  judge-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Judge BOUT-001 and BOUT-002
        run: python -m unittest discover -s tests -v
