<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOUT-001 · Erik vs ERIC</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --ink: #f5f0e8;
    --muted: #9a948a;
    --red: #e11d2e;
    --gold: #d4a84b;
    --line: #2a2a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 390px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .top {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .bout-id {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
  }
  .clock {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .title {
    padding: 18px 16px 8px;
    text-align: center;
  }
  .title h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .title .main {
    margin-top: 8px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .round {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 10px;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .fighters {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    padding: 20px 16px 22px;
  }
  .fighter {
    text-align: center;
  }
  .fighter .name {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .fighter .role {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .fighter.home .name { color: var(--gold); }
  .vs {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.2em;
    color: var(--red);
  }
  .roast {
    background: var(--red);
    color: #fff;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
    letter-spacing: 0.01em;
  }
  .foot {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>
  <article class="card" aria-label="Fight card BOUT-001">
    <header class="top">
      <span class="bout-id">BOUT-001 · Sealed</span>
      <span class="clock">12:00 · Round 1</span>
    </header>
    <div class="title">
      <h1>Personal AI Dual Meet</h1>
      <p class="main">Fight Card</p>
      <span class="round">Round 1 · HTML</span>
    </div>
    <div class="fighters">
      <div class="fighter home">
        <div class="name">Erik</div>
        <div class="role">Challenger</div>
      </div>
      <div class="vs" aria-hidden="true">VS</div>
      <div class="fighter">
        <div class="name">ERIC</div>
        <div class="role">Rival</div>
      </div>
    </div>
    <p class="roast">ERIC ships vibes. Erik ships the file.</p>
    <footer class="foot">
      <span>Referee: Erick</span>
      <span>No network · System fonts</span>
    </footer>
  </article>
</body>
</html>
