<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BOUT-002 Result</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0a0a0a;color:#f5f0e8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .b{width:1200px;height:630px;position:relative;padding:36px 40px;
    background:linear-gradient(135deg,#0c0c0e,#14141a 50%,#0a0a0c)}
  .id{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#d4a84b;font-weight:700}
  h1{margin-top:18px;font-size:64px;font-weight:900;letter-spacing:-.03em;line-height:1}
  .sub{margin-top:12px;font-size:18px;color:#9a948a}
  .row{position:absolute;left:40px;right:40px;top:220px;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
  .f{text-align:center}.f .n{font-size:48px;font-weight:900}.f.win .n{color:#d4a84b}
  .f .r{margin-top:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#9a948a}
  .vs{color:#e11d2e;font-weight:900;letter-spacing:.2em}
  .roast{position:absolute;left:40px;right:40px;bottom:90px;background:#e11d2e;color:#fff;padding:16px 20px;font-size:20px;font-weight:800;text-align:center}
  .foot{position:absolute;left:40px;right:40px;bottom:36px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6e6a63}
</style>
</head>
<body>
  <div class="b">
    <div class="id">BOUT-002 · Poster lane · Official result</div>
    <h1>Ink wins</h1>
    <div class="sub">Assistants Go to War · Rubric 6–6 · Timeline hook</div>
    <div class="row">
      <div class="f"><div class="n">Iron</div><div class="r">Clerk vs Anvil</div></div>
      <div class="vs">VS</div>
      <div class="f win"><div class="n">Ink</div><div class="r">Rook vs Pyre · Winner</div></div>
    </div>
    <div class="roast">Poster lane is a timeline sport. Ink’s card reads at scroll speed.</div>
    <div class="foot"><span>Grok Bout</span><span>1200 × 630</span></div>
  </div>
</body>
</html>
